name: LIFE_OS watchdog delivery test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-watchdog-delivery-test.yml'

permissions:
  contents: read
  issues: write

jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Send one test notification
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          msg="@lyulika LIFE_OS external watchdog delivery test from github-actions[bot] at ${now}. No action required."
          payload="$(python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' <<<"$msg")"
          curl -fsS -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "Content-Type: application/json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/1/comments"             -d "$payload" >/dev/null
          echo "DELIVERY_TEST_COMMENT=PASS"
